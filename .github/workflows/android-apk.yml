name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BYTE PHANTOM debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Read app version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate Android launcher icons
        run: |
          python -m pip install --upgrade pip pillow
          python scripts/generate-brand-assets.py --android

      - name: Build debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            ./gradlew --no-daemon assembleDebug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency download failed; retrying after backoff..."
              sleep $((attempt * 25))
            fi
          done
          exit 1

      - name: Rename versioned APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/BYTE-PHANTOM-v${VERSION}-Android-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYTE-PHANTOM-v${{ steps.version.outputs.version }}-Android-debug
          path: android/app/build/outputs/apk/debug/BYTE-PHANTOM-v${{ steps.version.outputs.version }}-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
