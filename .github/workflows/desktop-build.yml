name: Build Windows Desktop

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "electron/**"
      - "native/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BYTE PHANTOM Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate release metadata and JavaScript syntax
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check web/app.js
          node --check scripts/prepare-android.mjs
          node -e "const fs=require('node:fs');const pkg=require('./package.json');const meta=require('./web/version.json');const version=fs.readFileSync('VERSION','utf8').trim();if(pkg.version!==version||pkg.version!==meta.version)throw new Error('Release version mismatch');console.log('Validated BYTE PHANTOM '+version)"

      - name: Generate Windows and web icons
        run: |
          python -m pip install --upgrade pip pillow
          python scripts/generate-brand-assets.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable Windows app
        run: npm run desktop:build

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: BYTE-PHANTOM-v${{ steps.version.outputs.version }}-Windows-x64
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 30
